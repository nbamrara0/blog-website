<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        body{
            background:#0d0d0d;
            color:#f0ede8;
            font-family:'DM Sans',sans-serif;
            margin:0;
        }

        nav{
            background:#161616;
            padding:20px 5%;
            border-bottom:1px solid #2a2a2a;
        }

        nav a{
            color:#e8c97e;
            text-decoration:none;
            font-size:24px;
            font-weight:bold;
        }

        .container{
            max-width:900px;
            margin:80px auto;
            padding:0 20px;
        }

        .category{
            color:#c77dff;
            text-transform:uppercase;
            margin-bottom:15px;
        }

        h1{
            font-family:'Playfair Display',serif;
            font-size:48px;
            margin-bottom:20px;
        }

        .content{
            font-size:18px;
            line-height:1.9;
            color:#d4d4d4;
        }

        .back-btn{
            display:inline-block;
            margin-top:40px;
            color:#e8c97e;
            text-decoration:none;
        }

        .back-btn:hover{
            opacity:.8;
        }
    </style>
</head>
<body>

<nav>
    <a href="{{ url_for('blog') }}">Nav&Idea</a>
</nav>

<div class="container">

    <div class="category">
        {{ post.category }}
    </div>

    <h1>{{ post.title }}</h1>

    <div class="content">
        {{ post.content | safe }}
    </div>

    <a href="{{ url_for('blog') }}" class="back-btn">
        ← Back to Blog
    </a>

</div>

</body>
</html>
