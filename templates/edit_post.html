<form method="POST">

    <input
        type="text"
        name="title"
        value="{{ post.title }}"
        required>

    <br><br>

    <input
        type="text"
        name="category"
        value="{{ post.category }}"
        required>

    <br><br>

    <textarea
        name="content"
        rows="10">{{ post.content }}</textarea>

    <br><br>

    <button type="submit">
        Update Post
    </button>

</form>
